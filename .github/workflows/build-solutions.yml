name: Build agent assets

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PDS_AGENT_ASSETS_VERSION: 1.0.${{ github.run_number }}.${{ github.run_attempt }}

jobs:
  build-packages:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate source assets
        run: npm test

      - name: Build agent packages
        run: npm run package:agents

      - name: Verify Agent templates
        run: npm run verify:agents

      - name: Verify packages and stamp version
        shell: pwsh
        run: |
          $catalog = Get-Content -LiteralPath 'catalog.json' -Raw | ConvertFrom-Json
          $expectedCount = @($catalog.agents).Count
          $packageFiles = @(Get-ChildItem -LiteralPath 'dist/agent-packages' -Filter '*.zip' -File)
          if ($packageFiles.Count -ne $expectedCount) {
            throw "Expected $expectedCount agent package ZIP files, found $($packageFiles.Count)."
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($packageFile in $packageFiles) {
            $archive = [System.IO.Compression.ZipFile]::OpenRead($packageFile.FullName)
            try {
              $names = @($archive.Entries | ForEach-Object FullName)
              foreach ($required in @('manifest.json', 'instructions.md', 'README.md')) {
                if ($names -notcontains $required) {
                  throw "$($packageFile.Name) is missing $required."
                }
              }
              if (-not @($names | Where-Object { $_ -like 'skills/*/SKILL.md' })) {
                throw "$($packageFile.Name) contains no skill files."
              }
            } finally {
              $archive.Dispose()
            }
          }

          $env:PDS_AGENT_ASSETS_VERSION |
            Set-Content -LiteralPath 'dist/agent-packages/VERSION.txt' -Encoding ascii
          Copy-Item -LiteralPath 'RELEASE-README.md' -Destination 'dist/agent-packages/README.md'

      - name: Upload agent packages
        uses: actions/upload-artifact@v4
        with:
          name: pds-project-ai-agent-packages
          path: dist/agent-packages/
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: build-packages
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download agent packages
        uses: actions/download-artifact@v4
        with:
          name: pds-project-ai-agent-packages
          path: dist/agent-packages

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = $env:PDS_AGENT_ASSETS_VERSION
          $tag = "agents-v$version"
          $assets = @(Get-ChildItem -LiteralPath 'dist/agent-packages' -File | Sort-Object FullName | ForEach-Object FullName)
          gh release create $tag @assets `
            --target $env:GITHUB_SHA `
            --title "PDS Project AI agent assets v$version" `
            --notes "Automated Copilot Studio build from commit $env:GITHUB_SHA. Includes per-agent packages with BotDefinition templates, instructions, and skills. Version: $version."
