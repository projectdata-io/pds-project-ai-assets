name: Build agent assets

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PDS_AGENT_ASSETS_VERSION: 1.0.${{ github.run_number }}.${{ github.run_attempt }}

jobs:
  build-packages:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure M365 dev package environments
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          M365_AGENT_DEV_ENV_PROJECT_MANAGER_ASSISTANT: ${{ secrets.M365_AGENT_DEV_ENV_PROJECT_MANAGER_ASSISTANT }}
          M365_AGENT_DEV_ENV_SCHEDULE_QUALITY_ANALYST: ${{ secrets.M365_AGENT_DEV_ENV_SCHEDULE_QUALITY_ANALYST }}
          M365_AGENT_DEV_ENV_PORTFOLIO_EXECUTIVE_ANALYST: ${{ secrets.M365_AGENT_DEV_ENV_PORTFOLIO_EXECUTIVE_ANALYST }}
          M365_AGENT_DEV_ENV_RESOURCE_MANAGER: ${{ secrets.M365_AGENT_DEV_ENV_RESOURCE_MANAGER }}
          M365_AGENT_DEV_ENV_MPP_DATA_AUDITOR: ${{ secrets.M365_AGENT_DEV_ENV_MPP_DATA_AUDITOR }}
          M365_AGENT_DEV_ENV_PROJECT_PLAN_EDITOR: ${{ secrets.M365_AGENT_DEV_ENV_PROJECT_PLAN_EDITOR }}
          M365_AGENT_DEV_ENV_PROJECT_SCHEDULE_GENERATOR: ${{ secrets.M365_AGENT_DEV_ENV_PROJECT_SCHEDULE_GENERATOR }}
        run: |
          $packageEnvironments = @(
            @{ Slug = 'teams-project-manager-assistant'; SecretName = 'M365_AGENT_DEV_ENV_PROJECT_MANAGER_ASSISTANT'; Content = $env:M365_AGENT_DEV_ENV_PROJECT_MANAGER_ASSISTANT },
            @{ Slug = 'teams-schedule-quality-analyst'; SecretName = 'M365_AGENT_DEV_ENV_SCHEDULE_QUALITY_ANALYST'; Content = $env:M365_AGENT_DEV_ENV_SCHEDULE_QUALITY_ANALYST },
            @{ Slug = 'teams-portfolio-executive-analyst'; SecretName = 'M365_AGENT_DEV_ENV_PORTFOLIO_EXECUTIVE_ANALYST'; Content = $env:M365_AGENT_DEV_ENV_PORTFOLIO_EXECUTIVE_ANALYST },
            @{ Slug = 'teams-resource-manager'; SecretName = 'M365_AGENT_DEV_ENV_RESOURCE_MANAGER'; Content = $env:M365_AGENT_DEV_ENV_RESOURCE_MANAGER },
            @{ Slug = 'teams-mpp-data-auditor'; SecretName = 'M365_AGENT_DEV_ENV_MPP_DATA_AUDITOR'; Content = $env:M365_AGENT_DEV_ENV_MPP_DATA_AUDITOR },
            @{ Slug = 'teams-project-plan-editor'; SecretName = 'M365_AGENT_DEV_ENV_PROJECT_PLAN_EDITOR'; Content = $env:M365_AGENT_DEV_ENV_PROJECT_PLAN_EDITOR },
            @{ Slug = 'teams-project-schedule-generator'; SecretName = 'M365_AGENT_DEV_ENV_PROJECT_SCHEDULE_GENERATOR'; Content = $env:M365_AGENT_DEV_ENV_PROJECT_SCHEDULE_GENERATOR }
          )
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          foreach ($packageEnvironment in $packageEnvironments) {
            if ([string]::IsNullOrWhiteSpace($packageEnvironment.Content)) {
              throw "Required GitHub Actions secret $($packageEnvironment.SecretName) is not configured."
            }
            $environmentDirectory = Join-Path 'apps' "$($packageEnvironment.Slug)/env"
            New-Item -ItemType Directory -Path $environmentDirectory -Force | Out-Null
            [System.IO.File]::WriteAllText((Join-Path $environmentDirectory '.env.dev'), $packageEnvironment.Content, $utf8NoBom)
          }

      - name: Validate source assets
        run: npm test

      - name: Build agent packages
        run: npm run package:agents

      - name: Verify Agent templates
        run: npm run verify:agents

      - name: Build and validate installable M365 agent packages
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          ATK_CLI_SKILL: "true"
        run: |
          $packageSlugs = @(
            'teams-project-manager-assistant',
            'teams-schedule-quality-analyst',
            'teams-portfolio-executive-analyst',
            'teams-resource-manager',
            'teams-mpp-data-auditor',
            'teams-project-plan-editor',
            'teams-project-schedule-generator'
          )
          $outputDirectory = 'dist/m365-agent-packages'
          New-Item -ItemType Directory -Path $outputDirectory -Force | Out-Null

          foreach ($packageSlug in $packageSlugs) {
            $packageDirectory = Join-Path 'apps' $packageSlug
            Push-Location $packageDirectory
            try {
              npx --yes @microsoft/m365agentstoolkit-cli@beta package --env dev --manifest-file ./appPackage/manifest.dev.json --interactive false
              if ($LASTEXITCODE -ne 0) { throw "Toolkit package failed for $packageSlug." }
              npx --yes @microsoft/m365agentstoolkit-cli@beta validate --env dev --manifest-file ./appPackage/manifest.dev.json --interactive false
              if ($LASTEXITCODE -ne 0) { throw "Toolkit validation failed for $packageSlug." }
            } finally {
              Pop-Location
            }

            $packageZip = Join-Path $packageDirectory 'appPackage/build/appPackage.dev.zip'
            if (-not (Test-Path -LiteralPath $packageZip -PathType Leaf)) {
              throw "Toolkit did not create the expected package ZIP for $packageSlug."
            }
            Copy-Item -LiteralPath $packageZip -Destination (Join-Path $outputDirectory "$packageSlug.zip") -Force
          }

          $packageFiles = @(Get-ChildItem -LiteralPath $outputDirectory -Filter '*.zip' -File)
          if ($packageFiles.Count -ne $packageSlugs.Count) {
            throw "Expected $($packageSlugs.Count) installable M365 agent ZIP files, found $($packageFiles.Count)."
          }
          Copy-Item -LiteralPath 'M365-AGENT-DEPLOYMENT.md' -Destination (Join-Path $outputDirectory 'DEPLOYMENT.md') -Force

      - name: Verify packages and stamp version
        shell: pwsh
        run: |
          $catalog = Get-Content -LiteralPath 'catalog.json' -Raw | ConvertFrom-Json
          $expectedCount = @($catalog.agents).Count
          $packageFiles = @(Get-ChildItem -LiteralPath 'dist/agent-packages' -Filter '*.zip' -File)
          if ($packageFiles.Count -ne $expectedCount) {
            throw "Expected $expectedCount agent package ZIP files, found $($packageFiles.Count)."
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($packageFile in $packageFiles) {
            $archive = [System.IO.Compression.ZipFile]::OpenRead($packageFile.FullName)
            try {
              $names = @($archive.Entries | ForEach-Object FullName)
              foreach ($required in @('manifest.json', 'instructions.md', 'README.md')) {
                if ($names -notcontains $required) {
                  throw "$($packageFile.Name) is missing $required."
                }
              }
              if (-not @($names | Where-Object { $_ -like 'skills/*/SKILL.md' })) {
                throw "$($packageFile.Name) contains no skill files."
              }
            } finally {
              $archive.Dispose()
            }
          }

          $env:PDS_AGENT_ASSETS_VERSION |
            Set-Content -LiteralPath 'dist/agent-packages/VERSION.txt' -Encoding ascii
          Copy-Item -LiteralPath 'RELEASE-README.md' -Destination 'dist/agent-packages/README.md'

      - name: Upload agent packages
        uses: actions/upload-artifact@v4
        with:
          name: pds-project-ai-agent-packages
          path: dist/agent-packages/
          if-no-files-found: error
          retention-days: 14

      - name: Upload installable M365 agent packages
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: m365-agent-installable-packages
          path: dist/m365-agent-packages/
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: build-packages
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download agent packages
        uses: actions/download-artifact@v4
        with:
          name: pds-project-ai-agent-packages
          path: dist/agent-packages

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = $env:PDS_AGENT_ASSETS_VERSION
          $tag = "agents-v$version"
          $assets = @(Get-ChildItem -LiteralPath 'dist/agent-packages' -File | Sort-Object FullName | ForEach-Object FullName)
          gh release create $tag @assets `
            --target $env:GITHUB_SHA `
            --title "PDS Project AI agent assets v$version" `
            --notes "Automated Copilot Studio build from commit $env:GITHUB_SHA. Includes per-agent packages with BotDefinition templates, instructions, and skills. Version: $version."

  build-site:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install website dependencies
        run: npm ci --prefix site

      - name: Build static website
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          PUBLIC_GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run site:build

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy-site:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
