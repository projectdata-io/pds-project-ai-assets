# yaml-language-server: $schema=https://aka.ms/m365-agents-toolkits/v1.13/yaml.schema.json
version: v1.13

environmentFolderPath: ./env

provision:
  - uses: teamsApp/create
    with:
      name: "PDS Project AI: Project Manager Assistant${{APP_NAME_SUFFIX}}"
    writeToEnvironmentFile:
      teamsAppId: TEAMS_APP_ID

  - uses: oauth/register
    with:
      name: workiqwordprojectmanagerassistant
      appId: ${{TEAMS_APP_ID}}
      flow: authorizationCode
      identityProvider: MicrosoftEntra
      baseUrl: https://agent365.svc.cloud.microsoft/agents/tenants/${{WORKIQ_TENANT_ID}}/servers/mcp_WordServer
    writeToEnvironmentFile:
      configurationId: WORKIQ_WORD_AUTH_ID_PROJECT_MANAGER_ASSISTANT

  - uses: oauth/register
    with:
      name: workiqonedriveconversionprojectmanagerassistant
      appId: ${{TEAMS_APP_ID}}
      flow: authorizationCode
      identityProvider: MicrosoftEntra
      baseUrl: https://workiq.svc.cloud.microsoft/mcp
    writeToEnvironmentFile:
      configurationId: WORKIQ_ONEDRIVE_CONVERSION_AUTH_ID_PROJECT_MANAGER_ASSISTANT

  - uses: oauth/register
    with:
      name: workiqsharepointreportsprojectmanagerassistant
      appId: ${{TEAMS_APP_ID}}
      flow: authorizationCode
      identityProvider: MicrosoftEntra
      baseUrl: https://agent365.svc.cloud.microsoft/agents/tenants/${{WORKIQ_TENANT_ID}}/servers/mcp_SharePointRemoteServer
    writeToEnvironmentFile:
      configurationId: WORKIQ_SHAREPOINT_REPORTS_AUTH_ID_PROJECT_MANAGER_ASSISTANT

  - uses: dcr/register
    with:
      name: pdsprojectaiprojectmanagerassistant
      appId: ${{TEAMS_APP_ID}}
      applicableToApps: AnyApp
      targetAudience: HomeTenant
      wellKnownAuthorizationServer: https://mcp.projectdata.ai/.well-known/oauth-authorization-server
      targetUrlsShouldStartWith:
        - https://mcp.projectdata.ai
    writeToEnvironmentFile:
      configurationId: MCP_DA_AUTH_ID_PROJECT_MANAGER_ASSISTANT

  - uses: teamsApp/zipAppPackage
    with:
      manifestPath: ./appPackage/manifest.dev.json
      outputZipPath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
      outputFolder: ./appPackage/build
  - uses: teamsApp/validateAppPackage
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip

  - uses: teamsApp/update
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip

  - uses: teamsApp/extendToM365
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
      scope: shared
    writeToEnvironmentFile:
      titleId: M365_TITLE_ID
      appId: M365_APP_ID
projectId: 32751b19-8b2e-407d-9168-e5192f738cec

publish:
  - uses: teamsApp/zipAppPackage
    with:
      manifestPath: ./appPackage/manifest.dev.json
      outputZipPath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
      outputFolder: ./appPackage/build
  - uses: teamsApp/validateAppPackage
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
  - uses: teamsApp/publishAppPackage
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
    writeToEnvironmentFile:
      publishedAppId: TEAMS_APP_PUBLISHED_APP_ID
