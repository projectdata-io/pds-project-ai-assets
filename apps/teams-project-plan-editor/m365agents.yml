# yaml-language-server: $schema=https://aka.ms/m365-agents-toolkits/v1.13/yaml.schema.json
version: v1.13
environmentFolderPath: ./env
provision:
  - uses: teamsApp/create
    with:
      name: "PDS Project AI: Project Plan Editor${{APP_NAME_SUFFIX}}"
    writeToEnvironmentFile:
      teamsAppId: TEAMS_APP_ID

  - uses: dcr/register
    with:
      name: pdsprojectaiprojectplaneditor
      appId: ${{TEAMS_APP_ID}}
      applicableToApps: AnyApp
      targetAudience: HomeTenant
      wellKnownAuthorizationServer: https://mcp.projectdata.ai/.well-known/oauth-authorization-server
      targetUrlsShouldStartWith:
        - https://mcp.projectdata.ai
    writeToEnvironmentFile:
      configurationId: MCP_DA_AUTH_ID_PROJECT_PLAN_EDITOR

  - uses: teamsApp/zipAppPackage
    with:
      manifestPath: ./appPackage/manifest.dev.json
      outputZipPath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
      outputFolder: ./appPackage/build
  - uses: teamsApp/validateAppPackage
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
  - uses: teamsApp/update
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
  - uses: teamsApp/extendToM365
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
      scope: shared
    writeToEnvironmentFile:
      titleId: M365_TITLE_ID
      appId: M365_APP_ID

projectId: 680476f0-bef1-422d-8ef5-b3e5c49b5a27

publish:
  - uses: teamsApp/zipAppPackage
    with:
      manifestPath: ./appPackage/manifest.dev.json
      outputZipPath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
      outputFolder: ./appPackage/build
  - uses: teamsApp/validateAppPackage
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
  - uses: teamsApp/publishAppPackage
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
    writeToEnvironmentFile:
      publishedAppId: TEAMS_APP_PUBLISHED_APP_ID
